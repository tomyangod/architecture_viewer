# Architecture Viewer — Docker Compose
# 用法：docker compose up -d
# 访问：http://localhost:3847

services:
  arch-viewer:
    build: .
    ports:
      - "3847:3847"
    environment:
      - ARCH_WEB_PROJECTS_LIST=1
      - ARCH_PUBLIC_URL=http://localhost:3847
      # 生产必改：openssl rand -hex 32
      - ARCH_PRO_SECRET=change-me-in-production
      # - ARCH_PRO_ADMIN_TOKEN=...
      # - ARCH_STRIPE_SECRET_KEY=sk_live_...
      # - ARCH_STRIPE_PRICE_ID=price_...
      # - DEEPSEEK_API_KEY=sk-...
    volumes:
      - arch-data:/app/.data
    restart: unless-stopped

volumes:
  arch-data:
