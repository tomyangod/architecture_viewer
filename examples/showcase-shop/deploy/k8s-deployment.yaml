apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-shop-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: showcase-shop-api
  template:
    metadata:
      labels:
        app: showcase-shop-api
    spec:
      containers:
        - name: api
          image: showcase-shop/api:latest
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: showcase-shop-api
spec:
  selector:
    app: showcase-shop-api
  ports:
    - port: 80
      targetPort: 8080
