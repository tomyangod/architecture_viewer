services:
  frontend:
    image: showcase-shop/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    image: showcase-shop/api:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      REDIS_URL: redis://redis:6379/0
      MQ_URL: amqp://mq:5672
    depends_on:
      - postgres
      - redis
      - mq

  worker:
    image: showcase-shop/worker:latest
    environment:
      MQ_URL: amqp://mq:5672
      NOTIFY_URL: https://notify.example.com
    depends_on:
      - mq

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop

  redis:
    image: redis:7-alpine

  mq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
