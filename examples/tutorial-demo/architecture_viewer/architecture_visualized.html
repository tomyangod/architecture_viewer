    }

    function extractNodeText(gNode) {
        const texts = [];
        const walker = document.createTreeWalker(gNode, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
            const t = walker.currentNode.textContent.trim();
            if (t) texts.push(t);
        }
        return texts.join(' ');
    }

    function getPathStartEnd(el) {
        if (el.tagName === 'line') {
            return {
                start: [parseFloat(el.getAttribute('x1')), parseFloat(el.getAttribute('y1'))],
                end: [parseFloat(el.getAttribute('x2')), parseFloat(el.getAttribute('y2'))]
            };
        }
        if (el.tagName === 'path') {
            const d = el.getAttribute('d');
            if (!d) return null;
            const allNums = d.match(/[-\d.]+/g);
            if (!allNums || allNums.length < 4) return null;
            const nums = allNums.map(Number);
            return { start: [nums[0], nums[1]], end: [nums[nums.length - 2], nums[nums.length - 1]] };
        }
        return null;
    }

    function indexSvgElements(svg, tabId) {
        const nodes = new Map();
        const edges = new Map();
        const adjacency = new Map();
        const edgeLabels = new Map();
        const nodeEdgeMap = new Map();
        const clusters = new Map();

        function getBBoxIn(el, container) {
            const bbox = el.getBBox();
            const ctm = el.getCTM();
            const containerCtm = container.getCTM();
            if (!ctm || !containerCtm) return null;
            const invContainer = containerCtm.inverse();
            const m = ctm.multiply(invContainer);
            const corners = [
                { x: bbox.x, y: bbox.y },
                { x: bbox.x + bbox.width, y: bbox.y },
                { x: bbox.x, y: bbox.y + bbox.height },
                { x: bbox.x + bbox.width, y: bbox.y + bbox.height }
            ].map(p => {
                const pt = svg.createSVGPoint();
                pt.x = p.x; pt.y = p.y;
                return pt.matrixTransform(m);
            });
            const xs = corners.map(p => p.x), ys = corners.map(p => p.y);
            const minX = Math.min(...xs), maxX = Math.max(...xs);
            const minY = Math.min(...ys), maxY = Math.max(...ys);
            return { x: minX, y: minY, w: maxX - minX, h: maxY - minY, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
        }

        function pointRectDist(px, py, rect) {
            const dx = Math.max(rect.x - px, 0, px - (rect.x + rect.w));
            const dy = Math.max(rect.y - py, 0, py - (rect.y + rect.h));
            return Math.hypot(dx, dy);
        }

        function matchEdgeToNodes(edge) {
            const pts = getPathStartEnd(edge.el);
            if (!pts) return;
            const { start, end } = pts;
            function nearestK(px, py, k) {
                const dists = [];
                nodes.forEach((node, nid) => {
                    dists.push({ nid, d: pointRectDist(px, py, node.bbox) });
                });
                dists.sort((a, b) => a.d - b.d);
                return dists.slice(0, k);
            }
            const fromCandidates = nearestK(start[0], start[1], 2);
            const toCandidates = nearestK(end[0], end[1], 2);
            const fromBest = fromCandidates[0];
            const toBest = toCandidates[0];
            const from2nd = fromCandidates[1];
            const to2nd = toCandidates[1];
            const tightThreshold = 80;
            const looseThreshold = 200;
            const minMargin = 30;
            let fromId = null, toId = null;
            if (fromBest && fromBest.d < tightThreshold) {
                fromId = fromBest.nid;
            } else if (fromBest && fromBest.d < looseThreshold && from2nd && (from2nd.d - fromBest.d) > minMargin) {
                fromId = fromBest.nid;
            }
            if (toBest && toBest.d < tightThreshold) {
                toId = toBest.nid;
            } else if (toBest && toBest.d < looseThreshold && to2nd && (to2nd.d - toBest.d) > minMargin) {
                toId = toBest.nid;
            }
            if (fromId && toId && fromId !== toId) {
                edge.from = fromId;
                edge.to = toId;
                if (!adjacency.has(fromId)) adjacency.set(fromId, new Set());
                if (!adjacency.has(toId)) adjacency.set(toId, new Set());
                adjacency.get(fromId).add(toId);
                adjacency.get(toId).add(fromId);
                if (!nodeEdgeMap.has(fromId)) nodeEdgeMap.set(fromId, new Set());
                if (!nodeEdgeMap.has(toId)) nodeEdgeMap.set(toId, new Set());
                nodeEdgeMap.get(fromId).add(edge.id);
                nodeEdgeMap.get(toId).add(edge.id);
            }
        }

        const rootG = Array.from(svg.children).find(c => c.tagName === 'g');
        const structuredRoot = rootG && rootG.querySelector('.root');
        if (structuredRoot) {
            const innerRoot = structuredRoot;
            const edgeContainer = innerRoot.querySelector('.edgePaths');
            const nodesContainer = innerRoot.querySelector('.nodes');
            const labelsContainer = innerRoot.querySelector('.edgeLabels');
            const clustersContainer = innerRoot.querySelector('.clusters');
            const coordContext = edgeContainer || innerRoot;
            if (clustersContainer) {
                clustersContainer.querySelectorAll('.cluster').forEach(c => {
                    const cid = 'cluster_' + Math.random().toString(36).slice(2, 9);
                    c.id = cid;
                    c.classList.add('cluster');
                    const bbox = getBBoxIn(c, coordContext);
                    if (bbox) clusters.set(cid, { el: c, id: cid, bbox });
                });
            }
            if (nodesContainer) {
                const subgraphRoots = Array.from(nodesContainer.children).filter(c => c.classList.contains('root'));
                subgraphRoots.forEach(r => {
                    const cid = 'cluster_' + Math.random().toString(36).slice(2, 9);
                    r.id = cid;
                    r.classList.add('cluster');
                    const bbox = getBBoxIn(r, coordContext);
                    if (bbox) clusters.set(cid, { el: r, id: cid, bbox });
                });
                const nodeEls = nodesContainer.querySelectorAll('.node');
                nodeEls.forEach(n => {
                    const nid = 'node_' + Math.random().toString(36).slice(2, 9);
                    n.id = nid;
                    n.classList.add('node');
                    const text = extractNodeText(n);
                    const bbox = getBBoxIn(n, coordContext);
                    if (!bbox) return;
                    nodes.set(nid, { el: n, text, id: nid, bbox });
                    adjacency.set(nid, new Set());
                    nodeEdgeMap.set(nid, new Set());
                });
            }
            if (edgeContainer) {
                const edgeEls = Array.from(edgeContainer.children).filter(c =>
                    (c.tagName === 'path' || c.tagName === 'line') && c.getAttribute('marker-end')
                );
                edgeEls.forEach((el, i) => {
                    const eid = 'edge_' + Math.random().toString(36).slice(2, 9);
                    el.id = eid;
                    el.classList.add('edgePath');
                    edges.set(eid, { el, from: null, to: null, id: eid });
                    if (labelsContainer) {
                        const labelEls = labelsContainer.children;
                        if (labelEls[i]) {
                            const labelEl = labelEls[i];
                            const labelText = extractNodeText(labelEl);
                            edgeLabels.set(eid, { el: labelEl, text: labelText, allEls: [labelEl] });
                            labelEl.classList.add('edgeLabel');
                        }
                    }
                });
            }
        } else {
            const svgChildren = Array.from(svg.children);
            let edgeLayer = null;
            for (const child of svgChildren) {
                if (child.tagName !== 'g') continue;
                const markerPaths = child.querySelectorAll('path[marker-end], line[marker-end]');
                if (markerPaths.length > 0) {
                    edgeLayer = child;
                    break;
                }
            }
            for (const child of svgChildren) {
                if (child.tagName !== 'g') continue;
                if (child === edgeLayer) continue;
                const textEl = child.querySelector('text');
                const rect = child.querySelector('rect');
                if (!textEl || !rect) continue;
                const w = parseFloat(rect.getAttribute('width') || '0');
                const h = parseFloat(rect.getAttribute('height') || '0');
                const x = parseFloat(rect.getAttribute('x') || '0');
                const y = parseFloat(rect.getAttribute('y') || '0');
                const isPersonMan = child.classList.contains('person-man');
                const isCluster = !isPersonMan && (w > 400 || h > 200);
                if (isCluster) {
                    const cid = 'cluster_' + Math.random().toString(36).slice(2, 9);
                    child.id = cid;
                    child.classList.add('cluster');
                    clusters.set(cid, { el: child, id: cid, bbox: { x, y, w, h } });
                    continue;
                }
                const nid = 'node_' + Math.random().toString(36).slice(2, 9);
                child.id = nid;
                child.classList.add('node');
                const text = extractNodeText(child);
                const cx = x + w / 2;
                const cy = y + h / 2;
                nodes.set(nid, { el: child, text: text, id: nid, bbox: { x, y, w, h, cx, cy } });
                adjacency.set(nid, new Set());
                nodeEdgeMap.set(nid, new Set());
            }
            if (edgeLayer) {
                const edgeChildren = Array.from(edgeLayer.children);
                let pendingEdge = null;
                let pendingLabels = [];
                function flushPendingEdge() {
                    if (pendingEdge) {
                        const eid = pendingEdge.id;
                        edges.set(eid, pendingEdge);
                        if (pendingLabels.length > 0) {
                            edgeLabels.set(eid, { el: pendingLabels[0], text: pendingLabels.map(t => t.textContent.trim()).join(' '), allEls: pendingLabels });
                            pendingLabels.forEach(l => l.classList.add('edgeLabel'));
                        }
                    }
                    pendingEdge = null;
                    pendingLabels = [];
                }
                for (const child of edgeChildren) {
                    if (child.tagName === 'path' || child.tagName === 'line') {
                        flushPendingEdge();
                        const hasMarker = child.getAttribute('marker-end');
                        if (!hasMarker) continue;
                        const eid = 'edge_' + Math.random().toString(36).slice(2, 9);
                        child.id = eid;
                        child.classList.add('edgePath');
                        pendingEdge = { el: child, from: null, to: null, id: eid };
                    } else if (child.tagName === 'text') {
                        if (pendingEdge) {
                            pendingLabels.push(child);
                        }
                    }
                }
                flushPendingEdge();
            }
        }
        edges.forEach(matchEdgeToNodes);
        edges.forEach((edge) => {
            if (!edge.from || !edge.to || !nodes.has(edge.from) || !nodes.has(edge.to)) {
                matchEdgeToNodes(edge);
            }
        });
        svgGraphData[tabId] = { nodes, edges, adjacency, nodeEdgeMap, edgeLabels, clusters, svg };
        return svgGraphData[tabId];
    }

    function clearAllStates(tabId) {
        const allPres = getAllPres(tabId);
        if (allPres.length === 0) return;
        allPres.forEach(p => clearPreStates(p));
    }
    function clearPreStates(pre) {
        pre.classList.remove('dim-enabled', 'search-enabled', 'focus-mode');
        pre.querySelectorAll('.node, .edgePath, .edgeLabel, .cluster').forEach(el => {
            el.classList.remove('dimmed', 'highlighted', 'search-match', 'search-dim', 'focus-target', 'focus-related', 'focus-path', 'focus-hidden');
        });
    }

    function highlightNode(tabId, nodeId) {
        if (focusState[tabId] && focusState[tabId].targetId) return;
        const data = svgGraphData[tabId];
        if (!data) return;
        const activePre = getActivePre(tabId);
        if (!activePre) return;
        clearAllStates(tabId);
        activePre.classList.add('dim-enabled');
        const node = data.nodes.get(nodeId);
        if (!node) return;
        node.el.classList.add('highlighted');
        const neighbors = data.adjacency.get(nodeId) || new Set();
        const relatedEdges = new Set();
        data.nodeEdgeMap.get(nodeId)?.forEach(eid => relatedEdges.add(eid));
        neighbors.forEach(nid => {
            const neighbor = data.nodes.get(nid);
            if (neighbor) {
                neighbor.el.classList.add('highlighted');
                data.nodeEdgeMap.get(nid)?.forEach(eid => {
                    if (data.nodeEdgeMap.get(nodeId)?.has(eid)) relatedEdges.add(eid);
                });
            }
        });
        relatedEdges.forEach(eid => {
            const edge = data.edges.get(eid);
            if (edge) {
                edge.el.classList.add('highlighted');
                const lbl = data.edgeLabels.get(eid);
                if (lbl) lbl.el.classList.add('highlighted');
            }
        });
        activePre.querySelectorAll('.node:not(.highlighted)').forEach(el => el.classList.add('dimmed'));
        activePre.querySelectorAll('.edgePath:not(.highlighted)').forEach(el => el.classList.add('dimmed'));
        activePre.querySelectorAll('.edgeLabel:not(.highlighted)').forEach(el => el.classList.add('dimmed'));
    }

    function clearHighlight(tabId) {
        if (focusState[tabId] && focusState[tabId].targetId) return;
        clearAllStates(tabId);
    }

    function enterFocusMode(tabId, nodeId) {
        const data = svgGraphData[tabId];
        if (!data) return;
        const activePre = getActivePre(tabId);
        if (!activePre) return;
        clearAllStates(tabId);
        focusState[tabId] = { targetId: nodeId };
        activePre.classList.add('focus-mode');
        const node = data.nodes.get(nodeId);
        if (!node) return;
        node.el.classList.add('focus-target');
        const neighbors = data.adjacency.get(nodeId) || new Set();
        const relatedEdges = new Set();
        data.nodeEdgeMap.get(nodeId)?.forEach(eid => relatedEdges.add(eid));
        neighbors.forEach(nid => {
            const neighbor = data.nodes.get(nid);
            if (neighbor) neighbor.el.classList.add('focus-related');
            data.nodeEdgeMap.get(nid)?.forEach(eid => {
                if (data.nodeEdgeMap.get(nodeId)?.has(eid)) relatedEdges.add(eid);
            });
        });
        relatedEdges.forEach(eid => {
            const edge = data.edges.get(eid);
            if (edge) {
                edge.el.classList.add('focus-path');
                const lbl = data.edgeLabels.get(eid);
                if (lbl) lbl.el.classList.add('focus-path');
            }
        });
        activePre.querySelectorAll('.node:not(.focus-target):not(.focus-related)').forEach(el => el.classList.add('focus-hidden'));
        activePre.querySelectorAll('.edgePath:not(.focus-path)').forEach(el => el.classList.add('focus-hidden'));
        activePre.querySelectorAll('.edgeLabel:not(.focus-path)').forEach(el => el.classList.add('focus-hidden'));
        const tip = document.getElementById('focus-tip-' + tabId);
        if (tip) tip.classList.add('show');
    }

    function exitFocusMode(tabId) {
        focusState[tabId] = { targetId: null };
        clearAllStates(tabId);
        const tip = document.getElementById('focus-tip-' + tabId);
        if (tip) tip.classList.remove('show');
        const input = document.getElementById('search-input-' + tabId);
        if (input && input.value) {
            performSearch(tabId, input.value.trim());
        }
    }

    function getActivePre(tabId) {
        const config = diagramSources[tabId];
        if (config && config.multiBlock) {
            const idx = currentSubTab[tabId] || 0;
            return document.querySelector('#inner-' + tabId + ' .diagram-section[data-sub-idx="' + idx + '"] pre.mermaid');
        }
        return getPre(tabId);
    }

    function performSearch(tabId, query) {
        const data = svgGraphData[tabId];
        if (!data) return;
        const activePre = getActivePre(tabId);
        if (!activePre) return;
        const countEl = document.getElementById('match-count-' + tabId);
        if (focusState[tabId] && focusState[tabId].targetId) {
            exitFocusMode(tabId);
        }
        if (!query) {
            clearAllStates(tabId);
            if (countEl) countEl.style.display = 'none';
            return;
        }
        clearAllStates(tabId);
        activePre.classList.add('search-enabled');
        const q = query.toLowerCase();
        let matchCount = 0;
        data.nodes.forEach((node, nid) => {
            if (node.text.toLowerCase().includes(q)) {
                node.el.classList.add('search-match');
                matchCount++;
            } else {
                node.el.classList.add('search-dim');
            }
        });
        const matchedIds = new Set();
        data.nodes.forEach((node, nid) => {
            if (node.el.classList.contains('search-match')) matchedIds.add(nid);
        });
        data.edges.forEach((edge, eid) => {
            const hasMatch = matchedIds.has(edge.from) || matchedIds.has(edge.to);
            if (!hasMatch) edge.el.classList.add('search-dim');
        });
        if (countEl) {
            countEl.style.display = 'inline-block';
            countEl.innerHTML = matchCount > 0 ? '找到 <strong>' + matchCount + '</strong> 个匹配模块' : '未找到匹配模块';
        }
    }

    function clearSearch(tabId) {
        const input = document.getElementById('search-input-' + tabId);
        const box = document.getElementById('search-box-' + tabId);
        if (input) input.value = '';
        if (box) box.classList.remove('has-value');
        clearAllStates(tabId);
        const countEl = document.getElementById('match-count-' + tabId);
        if (countEl) countEl.style.display = 'none';
        if (input) input.focus();
    }

    function resetInteract(tabId) {
        exitFocusMode(tabId);
        clearSearch(tabId);
        clearAllStates(tabId);
        resetZoom(null, tabId);
    }

    function enhanceSvg(tabId) {
        ensureInteractToolbar(tabId);
        // 如果所有交互都禁用，仍然初始化但不加事件
        if (!FEATURES.hoverHighlight && !FEATURES.focusMode && !FEATURES.search) return;
        setTimeout(() => {
            const activePre = getActivePre(tabId);
            if (!activePre) return;
            const svg = activePre.querySelector('svg');
            if (!svg || svg.getAttribute('data-enhanced') === 'true') return;
            svg.setAttribute('data-enhanced', 'true');
            const data = indexSvgElements(svg, tabId);
            data.nodes.forEach((node, nid) => {
                if (FEATURES.hoverHighlight) {
                    node.el.addEventListener('mouseenter', function(e) {
                        highlightNode(tabId, nid);
                    });
                    node.el.addEventListener('mouseleave', function() {
                        clearHighlight(tabId);
                    });
                }
                if (FEATURES.focusMode) {
                    node.el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (focusState[tabId] && focusState[tabId].targetId === nid) {
                            exitFocusMode(tabId);
                        } else {
                            enterFocusMode(tabId, nid);
                        }
                    });
                }
            });
            if (FEATURES.focusMode) {
                svg.addEventListener('click', function(e) {
                    if (e.target === svg || e.target.tagName === 'rect' && e.target.closest('svg') === svg && !e.target.closest('.node')) {
                        if (focusState[tabId] && focusState[tabId].targetId) {
                            exitFocusMode(tabId);
                        }
                    }
                });
            }
        }, 150);
    }

    function initPan(canvasId, innerId) {
        if (!FEATURES.zoomPan) return;
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        let isPanning = false, startX, startY, scrollLeft, scrollTop;
        let hasMoved = false;
        const tabId = canvasId.replace('canvas-', '');
        canvas.addEventListener('mousedown', function(e) {
            const isNode = e.target.closest('.node');
            const isButton = e.target.closest('button') || e.target.closest('a');
            const isInput = e.target.closest('input');
            if (isButton || isInput) return;
            isPanning = true;
            hasMoved = false;
            canvas.classList.add('panning');
            startX = e.pageX - canvas.offsetLeft;
            startY = e.pageY - canvas.offsetTop;
            scrollLeft = canvas.scrollLeft;
            scrollTop = canvas.scrollTop;
            e.preventDefault();
        });
        canvas.addEventListener('mouseleave', function() {
            isPanning = false;
            canvas.classList.remove('panning');
        });
        canvas.addEventListener('mouseup', function(e) {
            isPanning = false;
            canvas.classList.remove('panning');
        });
        canvas.addEventListener('mousemove', function(e) {
            if (!isPanning) return;
            e.preventDefault();
            const x = e.pageX - canvas.offsetLeft;
            const y = e.pageY - canvas.offsetTop;
            const walkX = (x - startX);
            const walkY = (y - startY);
            if (Math.abs(walkX) > 3 || Math.abs(walkY) > 3) hasMoved = true;
            canvas.scrollLeft = scrollLeft - walkX;
            canvas.scrollTop = scrollTop - walkY;
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && focusState[tabId] && focusState[tabId].targetId) {
                exitFocusMode(tabId);
            }
        });
    }

    // ============================================================
    //  Window load: 保存内置 fallback，然后尝试加载 md 文件
    // ============================================================
    window.addEventListener('load', function() {
        TABS.forEach(tab => {
            const pre = getPre(tab.id);
            if (pre && !fallbackSources[tab.id]) {
                fallbackSources[tab.id] = pre.textContent.trim();
            }
        });
        if (TABS.length > 0) {
            setTimeout(async function() {
                await loadFromSource(TABS[0].id);
            }, 100);
        }
    });
    </script>
</body>
