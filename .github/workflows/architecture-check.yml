# Architecture Viewer — PR 漂移红灯（Community 模板）
#
# 用法：复制到你的仓库 `.github/workflows/architecture-check.yml`
# 前置：先跑一次 `npx arch-viewer init` 并把 `architecture_viewer/` 提交进仓库。
#
# 卖点：新模块 / 服务 / 入口没上图时 CI 失败，坏图进不了主干。
# 粒度是目录与部署单元，不是每一个新文件（文件级看 session report）。
# 非目标：逻辑错 / N+1 / 吞异常——本 Action 不管。
# 若 PR 改了 .av/graph-baseline.json：须人工确认（防洗白）；完整评论见 architecture-drift / architecture-diff。
# Pro / Team 再在此之上提供：托管门禁、PR 评论、增量同步（见 COMMERCIAL.md）。

name: Architecture Check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  drift:
    name: Protocol + drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Architecture Viewer CLI
        run: npm i -g arch-viewer@^0.2.1

      - name: Ensure kit exists
        run: |
          if [ ! -f architecture_viewer/architecture_visualized.html ]; then
            arch-viewer init . --dir architecture_viewer
          fi

      - name: Refresh skeleton diagrams
        run: arch-viewer generate . --dir architecture_viewer

      - name: Fail on protocol / placeholder / drift
        run: arch-viewer check architecture_viewer --filled --drift --repo .

      - name: How to fix
        if: failure()
        run: |
          echo "::error::架构图与代码漂移或协议失败。本地修复："
          echo "  npx arch-viewer generate ."
          echo "  npx arch-viewer generate . --refine   # 可选精修（需 DEEPSEEK_API_KEY）"
          echo "  npx arch-viewer check architecture_viewer --filled --drift --repo ."
          echo "然后把 architecture_viewer/ 一并提交。"
          exit 1
